service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: Baseline P95 là 1275 ms; ngưỡng 3000 ms giữ đủ headroom nhưng vẫn phát hiện tail latency ảnh hưởng người dùng.
  error_budget:
    formula: total_requests * (1 - target_percent / 100)
    allowed_bad_events_per_1000_requests: 5
    allowed_bad_events_per_10000_requests: 50
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
